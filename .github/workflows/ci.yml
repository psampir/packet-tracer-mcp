name: CI

# Lint and the full test suite on every push to main and every pull request.
# No credentials and no Packet Tracer are needed: the suite is offline and drives
# tests/fake_bridge.py, which answers on disk exactly like bridge/bridge.js does.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep uv quiet about its progress bar in CI logs. The interpreter is pinned
  # per job through setup-uv's python-version input.
  UV_NO_PROGRESS: "1"
  # Plain, colour-free tool output.
  NO_COLOR: "1"

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install the locked environment
        # --frozen: fail instead of silently re-resolving uv.lock; --extra dev
        # brings in pytest and ruff (the locked dev tools).
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test the PT bridge (Node)
        # bridge/bridge.js runs inside Packet Tracer's ES5 engine and is loaded
        # unmodified by tests/bridge/harness.js; node:test needs no dependencies.
        run: node --test tests/bridge/*.test.js

      - name: Test (+ coverage gate)
        # 85% is enforced twice: fail_under in pyproject.toml (local runs) and
        # --cov-fail-under here, so CI cannot drift from the documented gate.
        run: uv run pytest -q --cov=pt_mcp --cov-report=term-missing --cov-fail-under=85
